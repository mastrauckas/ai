name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: skills/dotnet-minimal-api/template/global.json

      - name: Restore
        run: dotnet restore
        working-directory: skills/dotnet-minimal-api/template

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: skills/dotnet-minimal-api/template

      - name: Test
        run: dotnet test --no-build --configuration Release
        working-directory: skills/dotnet-minimal-api/template

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Convert coverage to Cobertura
        run: |
          shopt -s globstar nullglob
          files=(tests/**/TestResults/**/*.coverage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .coverage files found under tests/**/TestResults" >&2
            exit 1
          fi

          mkdir -p TestResults
          "$HOME/.dotnet/tools/dotnet-coverage" merge "${files[@]}" \
            --output TestResults/coverage.cobertura.xml \
            --output-format cobertura
        working-directory: skills/dotnet-minimal-api/template

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: skills/dotnet-minimal-api/template/TestResults/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "80 90"

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
